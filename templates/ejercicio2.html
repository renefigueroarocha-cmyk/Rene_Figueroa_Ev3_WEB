{% extends 'base.html' %}

{% block title %}Ejercicio 2 - Nombres{% endblock %}

{% block content %}
<div class="card card-center">
    <form method="POST" action="{{ url_for('ejercicio2') }}">
        <div class="form-group">
            <label for="nombre1" class="label-normal">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1" value="{{ nombre1 }}" required>
        </div>

        <div class="form-group">
            <label for="nombre2" class="label-normal">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2" value="{{ nombre2 }}" required>
        </div>

        <div class="form-group">
            <label for="nombre3" class="label-normal">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3" value="{{ nombre3 }}" required>
        </div>

        <button type="submit" class="btn-submit">Enviar</button>
    </form>

    {% if nombre_mayor is not none %}
    <div class="resultado resultado-serif">
        <div>El nombre con mayor cantidad de caracteres es : {{ nombre_mayor }}</div>
        <div>El nombre tiene : {{ cantidad_caracteres }} caracteres</div>
    </div>
    {% endif %}
</div>
{% endblock %}
